plugins {
    id 'com.android.application'
}

android {
    namespace = "com.borealis.demo"
    compileSdkVersion 31

    defaultConfig {
        applicationId "com.CompendiumNX"
        minSdkVersion 24
        targetSdkVersion 31
        versionCode 2
        versionName "1.0.1"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }

        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'),
                    'proguard-rules.pro'
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}


// Automatically copy the APK after a successful debug build.
tasks.register("copyDebugApk", Copy) {
    def builtApk = file("$buildDir/outputs/apk/debug/app-debug.apk")
    from(builtApk)
    into("/storage/emulated/0/modding/CompendiumNX")
    rename { "Compendium-NX.apk" }
    doLast {
        if (file("/storage/emulated/0/modding/CompendiumNX/Compendium-NX.apk").exists()) {
            builtApk.delete()
        }
    }
}

afterEvaluate {
    tasks.named("assembleDebug").configure {
        finalizedBy("copyDebugApk")
    }
}
